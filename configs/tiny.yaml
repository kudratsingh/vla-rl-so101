# CPU-only preset. Must run end to end in <2 minutes on any machine. Never used for results.
preset: tiny
device: cpu
seed: 0

env:
  name: so101_tabletop
  tasks: [PickPlace]
  num_envs: 2
  image_size: 64
  max_episode_steps: 150   # oracle needs ~50-80 steps at 15 Hz
  randomize: false

data:
  demos_per_task: 2
  dataset_root: data/demos

policy:
  base: toy            # 2-layer MLP stand-in; real bases: openvla_oft | pi05 | smolvla
  lora_rank: 4

sft:
  steps: 20
  batch_size: 2
  lr: 1e-3

rl:                          # GRPO on the WO-03 toy task; keys documented in src/rl/trainer.py
  env: toy                   # src/rl/toy_env.py instead of ManiSkill
  samples_per_prompt: 4
  rollout_envs: 64           # 16 groups per env batch
  rollout_batch: 32          # groups per update -> 128 trajectories (2 env batches)
  max_rollout_rounds: 3
  steps: 100
  lr: 1e-2
  ppo_mini_batch: 32         # trajectories per optimizer step -> 4 steps per update
  micro_batch: 256
  clip_low: 0.2
  clip_high: 0.28
  temperature: 1.6
  kl_coef: 0.0
  dynamic_sampling: true
  eval_every: 10
  eval_episodes: 256
  checkpoint_every: 50
  gate_window: 5                  # spend gates on windowed rollout success (src/rl/gates.py)
  gate_check_frac: 0.25           # flat gate at step 25: trend over steps 1-25

toy:                         # synthetic verification task + 2-layer policy (src/rl/toy_*.py)
  grid_size: 5
  max_episode_steps: 6
  chunk_len: 2
  n_bins: 3
  hidden: 64

eval:
  episodes_per_cell: 4
  seeds: [0]
  cells: [seen]
