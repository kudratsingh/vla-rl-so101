# rl tier (A100 80 GB). WO-04/05 GRPO from the WO-02 SFT checkpoint.
# Inherits configs/sft.yaml so the policy block (base checkpoint + revision, precision, crop,
# LoRA layout) is exactly the one the SFT adapter was trained with; norm bounds come from the
# adapter's own norm_stats.json. The SFT checkpoint is passed per run:
#   uv run scripts/wo03_rl.py --preset rl --seed N --adapter <dir | user/repo/path/in/repo[@rev]>
#
# VRAM budget, A100-80GB (79 GiB usable). EVERY NUMBER IS A WO-03 ESTIMATE, NOT A MEASUREMENT;
# the WO-04 probe (`--probe-steps`, scripts/pod/wo04_job.sh) prints torch peak + device-wide use.
# Rollout and update alternate, so the peak is the larger phase, not the sum of both.
#   item                                       est. GiB  derivation
#   base model bf16 (OpenVLA-OFT ~7.54B)        14.0     7.54e9 params x 2 B (Llama-2-7B 6.74B
#                                                        + DINOv2-L 0.30B + SigLIP-400M 0.43B + proj)
#   LoRA r=32 all-linear + grads + AdamW         1.5     ~100M params (OpenVLA paper: 97.6M at
#                                                        r=32) x fp32 (4 B param + 4 B grad + 8 B m,v)
#   update activations @ micro_batch=8          18       per decision ~2.2 GiB: LLM ~40 B x s=340
#                                                        tokens (256 img + ~35 prompt + 48 action)
#                                                        x h=4096 x 32 layers = 1.65 GiB, SDPA (no
#                                                        s^2 term) + vision towers ~0.6 GiB (LoRA on
#                                                        them too); no grad checkpointing
#   rollout-phase activations @ 32 envs         (3)      one no-grad forward x 32 (OFT parallel
#                                                        decoding, no KV cache) + 32x48x32064 bf16
#                                                        action-slot logits; NOT concurrent with the update
#   ManiSkill GPU envs, 3 tasks x 32 @ 224^2     6       ~2 GiB per env instance (PhysX GPU buffers
#                                                        + Vulkan renderer + targets); one per task
#                                                        (WO-03 sized this at 128^2; sim.yaml renders 224;
#                                                        since 2026-11-08 only the trained tasks' envs
#                                                        are built: 2 x 2 = 4 GiB)
#   rollout buffer (obs, tokens, log-probs)      0       kept in host RAM: <= 12 env batches x 32
#                                                        x 19 decisions x 150 KB image = ~1.1 GB CPU
#   CUDA context + allocator slack               2.5
#   -------------------------------------------------
#   peak (update phase)                         ~42      14 + 1.5 + 18 + 6 + 2.5
#   headroom                                    ~37      >= 8 required. Room to raise micro_batch
#                                                        to 16 (~60 GiB peak) once WO-04 has
#                                                        measured; eager attention would add
#                                                        ~0.6 GiB per decision (5*a*s^2*layers).
# rollout_envs=32 fits by this estimate (64 would too: +~3 GiB rollout-phase, +~1 GiB/env).
#
# CURRENT SHAPE (2026-11-08, review 3.1 / 9: 16 prompts x K=8, lr 1e-4, ppo_epochs 2, periodic
# evals on the trained tasks only). `uv run scripts/wo03_rl.py --preset rl --estimate` recomputes
# this from cost.throughput (A100: rollout 86 actions/s MEASURED on WO-04 pod gzxhwhjhdtc1kc;
# update 10.3 decisions/s from the WO-02 SFT probe, pod u87r9sjnwig58d; forward 31 decisions/s
# ESTIMATED, ~3x update; see cost.throughput below); worst case = the
# dynamic-sampling refill cap binds every step (K=8 probes dropped 72% of groups):
#   trained trajectories   16 prompts x K=8                                =    128
#   episodes generated     128 x 3.0 (refill cap: 3 rounds x 4 env batches) =    384
#   env actions            384 x 120 (RL horizon)        = 46,080 -> / 86 per s  = 535.8 s
#   old log-prob recompute 128 x ceil(120 / 8) = 1,920 decisions / 31 per s     =  61.9 s
#   update                 2 epochs x 1,920 decisions / 10.3 per s              = 372.8 s
#                          (2 mini-batches of 64 x 2 epochs = 4 Adam steps; upstream ~4)
#   fixed-batch diagnostic 32 trajectories x 15 decisions = 480 / 31 per s      =  15.5 s
#   step                                                               = 986.0 s = 16.4 min
#   evals (sanity only)    steps {0, 25, ..., 150}: 7 x 32 episodes x 2 trained tasks
#                          x 120 actions / 86 per s                             =   0.17 h
#   run: 150 x 986 s + 0.17 h = 41.3 h x $1.79 = ~$74 per seed, worst case. The K=16 runs hit the
#   refill cap on only 16-26% of steps (~11.5 min/step measured), so expect less if the new base
#   drops fewer groups. Flat-gate stop at step 38: ~10.5 h = ~$19.
#   estimated: A100-80GB x 41.3 h = $74 per seed (worst case); flat-gate stop 10.5 h = $19
# vs the previous 8 x K=16, 1 epoch shape: same 128 trajectories and the same rollout cap (4 env
# batches per round), +186 s/step for the second epoch, +15 s for the diagnostic.
#
# RTX 4090 ($0.89/h) vs A100-80GB ($1.79/h, the rl tier in docs/ENVIRONMENT.md). Derived from the
# one measurement we have (WO-02 4090 probe: 1.55-1.58 s per SFT step, batch 8, grad checkpointing,
# bf16); everything else is an ESTIMATE that the WO-04 probe replaces:
#   one SFT sample = one RL decision (same 256 patches + proprio + prompt + 48 action tokens)
#   FLOPs: forward ~2 x 7.5e9 x ~340 tokens = ~5.1 TFLOP; LoRA backward ~1 forward (activation
#     grads only, base frozen); grad checkpointing +1 forward -> SFT sample ~15.3 TFLOP
#   4090 achieved: 8 x 15.3 / 1.565 s = ~78 TFLOP/s (~47% of 165 dense bf16)
#     -> update with grad ckpt 5.1 decisions/s (measured-derived); rollout 78 / 5.1 = 15
#        decisions/s = ~122 env actions/s
#     -> step 24,000 / 122 + 2,432 / 5.1 = 197 + 477 s = 11.2 min; 300 steps + evals = ~57 h
#        x $0.89 = ~$50 per seed. VRAM: 14 weights + 1.5 LoRA/Adam + 2.5 context + ~6 for
#        3 x 32 GPU envs = ~24 GB before any activation: does NOT fit the preset on 24 GB
#        (would need fewer envs per task -> more env batches -> slower still).
#   A100 at the same ~47% MFU (147 of 312 TFLOP/s): update without ckpt (2 forwards) 14.4
#     decisions/s (this file assumes 12), rollout 29 decisions/s = ~230 actions/s (assumes 250)
#     -> 104 + 169 s = 4.6 min/step; 300 steps + evals = ~23 h x $1.79 = ~$41 per seed.
#   => A100 stays: same $ within the error of these estimates (~$41-45 vs ~$50), less than half the
#      wall-clock, and the only one of the two with VRAM headroom. H100 PCIe ($2.89/h) breaks even
#      at >= 1.61x A100 speed (unmeasured).
#   ADR-0002 reopens the recipe if a run is > 12 h on an A100; every estimate here is ~2x that.
preset: rl
device: cuda
seed: 0
inherit: configs/sft.yaml

policy:
  adapter: KudratSingh22/vla-rl-so101-sft/wo02/u87r9sjnwig58d/runs/20261027T073615Z-wo02-sim-4b4b/checkpoints/step_004000
                            # WO-02 SFT base: attempt 4 step 4000 (seen 18/16/6%), meets the amended
                            # rule 3 (>=10% on >=2 tasks); --adapter overrides

rl:                         # GRPO, ADR-0002; every key is documented in src/rl/trainer.py
  algorithm: grpo
  samples_per_prompt: 8     # K. 2026-11-08 (review 3.1 item 5): 16 prompts x K=8 doubles the
                            # prompts per update at the same 128 trajectories as 8 x K=16; the
                            # extra all-equal groups on hard states are dropped by dynamic sampling
  rollout_envs: 32          # parallel envs per env batch (4 groups at K=8); one env per task
  rollout_batch: 16         # prompts (groups) per update -> 128 trajectories (upstream: 64 x 8)
  max_rollout_rounds: 3     # dynamic-sampling refill cap, in multiples of one full round
  steps: 150                # owner amendment (ADR-0002): was 300
  # lr 1e-4 rests on the published LoRA recipes (RIPT-VLA, RLinf-VLA; RL4VLA also uses 1e-4 for
  # LoRA), NOT on the logged approx_kl / clip_frac: those were averaged over mini-batches measured
  # before their own optimizer step and are uninformative (review 3.1). `--lr-sweep` measures the
  # on-batch movement per lr before any longer run.
  lr: 1e-4                  # was 5e-5 (owner, WO-04), 1e-5 before that
  weight_decay: 0.01
  grad_clip: 1.0            # not a step-size lever under Adam (rescaling g cancels); lr/epochs are
  ppo_epochs: 2             # 2026-11-08: was 1
  ppo_mini_batch: 64        # trajectories per optimizer step -> 2 per epoch, 4 per update
  micro_batch: 8            # decisions per forward/backward; memory only, gradient unchanged
  clip_low: 0.2
  clip_high: 0.28
  temperature: 1.0          # owner amendment (ADR-0002): 1.6 dropped 92-93% of groups;
                            # `--probe-temperatures 0.7,1.0,1.3` measures drop rate / success
  kl_coef: 0.0              # must stay 0 (no reference model)
  dynamic_sampling: true
  # Upstream recomputes old log-probs with an extra no-grad forward. The WO-04 probes measured
  # first-minibatch |log ratio| max 0.196 (A100) / 0.149 (H100) with sampler log-probs reused,
  # well over the 0.05 bar, so it is on (owner amendment, ADR-0002).
  recompute_old_log_probs: true
  # Periodic greedy evals: SANITY LOGS ONLY, on the trained tasks only (Stack's eval-only evals
  # cost ~$0.5/run for nothing). The fixed held-out protocol eval (scripts/wo02_eval.py) is the
  # only measurement of improvement; step 0 also enforces CLAUDE.md rule 3.
  eval_every: 25
  eval_episodes: 32         # per trained task, greedy, fixed seeds
  checkpoint_every: 25      # resume (--resume) loses at most 25 steps (~6.8 h worst case)
  # Spend gates (src/rl/gates.py), replacing the 64-episode kill switch and the 32-episode peak
  # stop (neither could tell +3 points from 0). They decide whether to KEEP SPENDING on this run;
  # they do not decide whether RL improved the policy. Inputs: windowed rollout/success_rate over
  # every generated episode (~130-380 per step), but the unit is the GROUP (its K samples share a
  # scene): 8-24 groups per task per step, so under WO-04-like scene heterogeneity a 10-step
  # window's score has a group-level SE of ~1-2 points (a two-window difference ~1.5-2.5). The
  # episodes also come from a changing policy, hence not a measure of improvement. Plus the
  # rollout's sampled-token entropy.
  gate_window: 10           # steps per window
  gate_check_frac: 0.25     # flat gate at step ceil(0.25 x 150) = 38: window 29-38 vs 1-10
  gate_min_gain: 0.03       # owner's +3 points (WO-04), now on windowed SAMPLED success (owner to
                            # confirm: sampled success moved 7.9% -> 12.6% over 150 K=16 steps)
  gate_rule: any_task       # owner 2026-10-28: pass if ANY trained task gained it
  gate_max_drop: 0.04       # decline: stop if the window is > 4 points below its best
                            # non-overlapping window (replaces the step-50/100 peak stop) ...
  gate_decline_z: 3.0       # ... AND > 3 x SE(best - window), on two consecutive non-overlapping
                            # windows; z = 2 stopped 35/100 simulated flat runs (src/rl/gates.py)
  gate_entropy_min: 0.5     # nats/token at T: below this sampling has collapsed onto the argmax
                            # (WO-04 K=16 run: 1.32 -> 1.07 over 150 steps); judgment, not measured
  gate_stop: true
  # Fixed-batch policy-movement diagnostic (src/rl/diagnostics.py): diag/pre/* and diag/post/*
  # = per-token |dlogp| by advantage sign, k3 KL and clip fraction of the first 32 trajectories of
  # each update, before and after ALL its optimizer steps; + train/grad_norm. ~15 s per step.
  diag_every: 1
  diag_trajectories: 32
  diag_argmax: false        # greedy argmax flip rate: +2 forwards (~31 s/step); on in --lr-sweep
  require_nonzero_baseline: true  # CLAUDE.md rule 3: abort if the step-0 eval is 0 on every task
  group_reset_check: error  # identical reset seeds must give identical scenes
  # Owner amendment (ADR-0002): RL rollouts on PickPlace + Push only; Stack (0/64 at step 0, every
  # group all-zero) is not trained and, since 2026-11-08, not in the periodic evals either.
  train_tasks: [PickPlace, Push]
  # RL rollout + in-training eval horizon (owner amendment, ADR-0002); the protocol eval
  # (scripts/wo02_eval.py) keeps env.max_episode_steps = 150.
  max_episode_steps: 120

cost:
  gpu: A100-80GB
  usd_per_hour: 1.79
  est_s_per_step: null      # sft.yaml's SFT estimate does not apply to RL
  setup_hours: 0.5          # image pull, apt, uv sync, 15 GB checkpoint download (as sft.yaml)
  estimated_hours: null     # agent fills before every run (from --estimate, then the probe)
  throughput:               # A100-80GB, MEASURED 2026-10-27 on pod u87r9sjnwig58d (WO-02 attempt 4)
    rollout_actions_per_s: 86      # RL rollout (sampling, 32 GPU envs, 224 px): 44.5 s per 32 x 120
                                   # batch (pod gzxhwhjhdtc1kc); 55.9 s per 32 x 150 (5rdd45j801bk5b)
    forward_decisions_per_s: 31    # no-grad forward ~1/3 of an update (est.; recompute is off)
    update_decisions_per_s: 10.3   # SFT probe 0.774 s per 8-decision step, LoRA, no grad-ckpt (was est. 12)
    mean_episode_frac: 1.0         # mean episode length / max_episode_steps (base succeeds ~13%)
    rollout_overhead: 3.0          # episodes generated per trained one: the refill cap
                                   # (max_rollout_rounds) bound every K=8 probe step -> worst case
