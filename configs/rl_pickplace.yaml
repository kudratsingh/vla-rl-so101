# WO-04 follow-up (owner, 2026-10-28): PickPlace-only GRPO, one seed, otherwise configs/rl.yaml.
# Seeds 1-2 of the PickPlace+Push run stopped flat at step 38: PickPlace gained 5-9 points while
# Push lost 2-9. This isolates whether RL improves one task when it gets every update. Push and
# Stack stay in the evals (eval-only). Gate for multi-task with stratified batches: >= +10 points.
#   SEED=0 RL_CFG=configs/rl_pickplace.yaml bash scripts/pod/wo04_job.sh
inherit: configs/rl.yaml

rl:
  train_tasks: [PickPlace]
  checkpoint_every: 25      # owner 2026-10-28: every eval step has a checkpoint
  peak_stop_step: 100       # owner 2026-10-28: if step 100 < step 50 (trained-task eval), stop:
  peak_ref_step: 50         #   "don't train past the peak"; the best checkpoint is evaluated
