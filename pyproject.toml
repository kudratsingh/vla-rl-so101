[project]
name = "vla-rl-so101"
version = "0.0.1"
description = "Single-GPU RL post-training of a VLA, deployed to a real SO-101"
requires-python = ">=3.11,<3.12"
# Resolved pins and the reason for each live in docs/ENVIRONMENT.md. uv.lock is the source of truth.
dependencies = [
  "numpy",
  "pyyaml",
  "pydantic>=2",
  "tqdm",
  "gymnasium",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "torchcodec==0.2.1",       # torch 2.6 pairing; video decode (never PyAV, rule 6)
  "mani-skill==3.0.1",
  "sapien==3.0.3",           # first SAPIEN line with macOS wheels is 3.0.2
  "lerobot==0.4.4",          # last release supporting Python 3.11; LeRobotDataset v3.0
  "huggingface_hub",
]

[project.optional-dependencies]
smolvla = ["lerobot[smolvla]==0.4.4"]
gpu = [
  "accelerate",
  "peft",
  "grpcio",
  "grpcio-tools",
  "wandb",
  # OpenVLA-OFT runs vendored (src/policy/oft/vendor) on STOCK transformers + a bidirectional-mask
  # hook, bit-identical to the moojink/transformers-openvla-oft fork; no fork, no uv conflicts
  # with smolvla, no flash-attn / bitsandbytes / tensorflow (docs/adr/0001-base-model.md).
  "transformers==4.57.6",
  "timm==0.9.16",            # Prismatic code accepts only timm 0.9.10/11/12/16
]
robot = [
  "lerobot[feetech]==0.4.4",
  "grpcio",
  "opencv-python",
]
dev = ["pytest", "ruff", "black", "mypy", "types-PyYAML", "types-tqdm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
# owner's Mac (control + CPU dev) and the RunPod GPU box
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/policy/oft/vendor"]   # upstream code, kept verbatim (see its headers)

[tool.black]
line-length = 100
extend-exclude = "src/policy/oft/vendor/"

[tool.mypy]
strict = true
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.policy.oft.vendor.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_render: builds image-producing envs; skipped without a Vulkan render device"]
